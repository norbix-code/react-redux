# Dependabot keeps the package's npm dependencies and GitHub Actions versions
# fresh. CVE patches arrive out-of-band from the weekly cadence below.
#
# Two ecosystems are watched:
#   - npm:             package.json at repo root
#   - github-actions:  every `uses:` in .github/workflows/*

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    ignore:
      # TypeScript 7 is the native compiler: @typescript-eslint 8 supports
      # typescript <6.1 and tsup's DTS build needs the classic compiler API, so
      # a TS 7 bump cannot even install. Revisit when both support it.
      - dependency-name: 'typescript'
        versions: ['>= 7']
      # conventional-changelog-conventionalcommits 10 needs
      # conventional-changelog-writer@9; @semantic-release/release-notes-generator
      # 14.x ships writer 8, so v10 breaks release notes ("Missing helper").
      - dependency-name: 'conventional-changelog-conventionalcommits'
        versions: ['>= 10']
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      semantic-release:
        patterns:
          - 'semantic-release'
          - '@semantic-release/*'
          - 'conventional-changelog-conventionalcommits'
      # vitest and its plugins must move together (@vitest/coverage-v8 pins the
      # exact vitest version).
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-redux'
          - '@reduxjs/toolkit'
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
